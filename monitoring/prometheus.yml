global:
  scrape_interval: 15s     # How frequently Prometheus scrapes targets (default: 1m)
  evaluation_interval: 15s # How frequently Prometheus evaluates alerting/recording rules
  scrape_timeout: 10s      # Timeout before scrape fails

# Optional rule files for alerts/recordings
rule_files:
  # - "alert_rules.yml"

# A list of scrape configurations (jobs)
scrape_configs:
  # 1. Prometheus monitors itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Example: Server / Node Exporter (OS-level metrics like CPU/RAM)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # 3. Example: Your application service metrics
  - job_name: "web-app"
    metrics_path: "/metrics" # Default endpoint Prometheus looks for
    scrape_interval: 5s
    static_configs:
      - targets: ["web-app:80"] # Container name or service DNS within Kubernetes/Docker
