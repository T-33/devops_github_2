apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  labels:
    app: web-app
spec:
  # Use ClusterIP for internal cluster traffic,
  # or NodePort / LoadBalancer if you need external access
  type: ClusterIP
  selector:
    # Must match the label defined in the Deployment's pod template
    app: web-app
  ports:
    - name: http
      port: 80         # Port the service exposes inside the cluster
      targetPort: 80   # Port the container is listening on (containerPort)
      protocol: TCP
